name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only publish when the pushed commit is a release commit, e.g.
    # "Release 0.2.0". The version itself comes from package.json.
    if: startsWith(github.event.head_commit.message, 'Release ')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing requires a recent npm CLI.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm test

      # Skip if this package version is already on the registry, so re-running
      # or an unrelated release-message commit does not fail the job.
      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN needed: npm authenticates via OIDC.
      # Provenance is attached automatically for trusted publishers.
      - if: steps.check.outputs.published == 'false'
        run: npm publish
